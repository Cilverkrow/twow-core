# The only workflow in this repository, and deliberately so.
#
# twow-core is a fork whose entire purpose is to be reviewable and to send fixes
# back to Penqle. Until this file existed, nothing here could be checked: the
# repository's own first pull request had to record "a full local
# configure/build was unavailable because twow-core currently has no CI
# workflow" in its verification section. A fork that cannot compile itself
# cannot honestly claim that any of its 33 candidate upstream fixes are correct.
#
# One workflow, one PROPERTY per compiler, on purpose. The sibling repository
# twow-repo grew to 19 job entries across several workflow files, each with its
# own slightly different toolchain, and consolidating them back down to 5 cost a
# day. There is exactly one thing worth compiling here -- that the core builds
# and links -- so each compile job asserts that and nothing else.
#
# There are TWO compile jobs, and the second is not a duplicate of the first.
# `build` is GCC on Debian trixie: the toolchain that actually ships, and the
# complete gate. `windows-msvc` is cl.exe: it exists because this tree carries
# source that only MSVC can reject, and until it was added nothing anywhere
# compiled that source with a Microsoft compiler. Windows is a supported compile
# target for twow-core -- twow-repo, which is Linux-only, has its own
# windows-compile job gated off, and this is where that verification now lives.
# The comment block above the job says which fixes it covers and why GCC cannot.
#
# The third job, upstream-freshness, compiles nothing and is not a third
# toolchain. It asserts that UPSTREAM.lock still describes the branch this fork
# actually tracks; see the comment above it.

name: CI

# push on main only, plus pull_request. Not `push: branches: ['**']`, which was
# the first thing tried here: with a pull request open, every push fires both
# events and the same commit is built twice on two runners for forty minutes.
# Watching eight runs of this job queue up behind four pushes is what made the
# duplication obvious. Branch work is reviewed through a pull request in this
# repository anyway, so pull_request is the trigger that matters; main is built
# on push so the branch everything merges into always has a result of its own.
# workflow_dispatch is there for re-running a build after a runner-side failure
# that has nothing to do with the commit.
#
# upstream-tracking is deliberately NOT in the push list, though it was for one
# revision of this file. A push to that branch cannot run this workflow: GitHub
# reads the workflow file from the ref being pushed, and that ref is a verbatim
# mirror of upstream, which has no .github/workflows/ci.yml. Listing the branch
# looked like coverage and was decoration -- confirmed by watching a push to it
# start only the MSVC-Portabilität workflow, which does exist at that ref.
#
# The freshness job below reads origin/upstream-tracking live, so pull_request
# and the weekly schedule cover it for real. schedule is there because staleness
# is the one failure that arrives without anybody pushing anything.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

# Every run gets its own concurrency group, and nothing is ever cancelled.
#
# cancel-in-progress: false is not a preference here, it is what makes the
# ccache below work at all. actions/cache writes the cache in a POST step, which
# runs only if the job reaches the end of its lifecycle; a cancelled job is torn
# down before that, so the cache is never saved. In twow-repo a shared group
# with cancel-in-progress: true meant every push cancelled its predecessor, the
# post step never ran once, and a full day of builds were cold from scratch --
# with the cache key being computed and looked up correctly and missing every
# single time, which is why it took so long to see. Including github.run_id
# keeps two pushes to the same ref from colliding as well.
concurrency:
  group: ci-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  # The second job in this file, and the comment at the top still means what it
  # says: one BUILD, one toolchain. This one compiles nothing. It exists because
  # ADR-0026 stated the upstream branch in prose, prose is not executable, and an
  # agent merged a dead branch anyway -- hours of work against six commits that
  # are older than our own fork point. The rule now lives where code can check
  # it, in UPSTREAM.lock, and this is the code that checks it.
  #
  # Deliberately not `needs:`-chained to the build. A wrong upstream ref and a
  # broken compile are independent facts and both are worth knowing in the same
  # run; making this a gate would just hide the build result behind it.
  upstream-freshness:
    name: Upstream ref is the one we claim to track
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert UPSTREAM.lock against the real upstream
        env:
          # A pull request builds a merge commit whose first parent is the base
          # branch, so origin/<tracking branch> is not necessarily fetched by the
          # checkout. Fetched explicitly below rather than assumed.
          TRACKING_REMOTE: origin
        run: |
          set -euo pipefail

          field() {
            # awk rather than sed: every line in UPSTREAM.lock is `key = value`
            # with whitespace around the `=`, which awk's default field splitting
            # reads directly -- no regex full of backslashes to be mangled on its
            # way through YAML and two shells.
            awk -v k="$1" '$1 == k && $2 == "=" { print $3; exit }' UPSTREAM.lock
          }

          UPSTREAM_URL=$(field upstream_url)
          UPSTREAM_BRANCH=$(field upstream_branch)
          FORK_POINT=$(field fork_point)
          TRACK_BRANCH=$(field upstream_tracking_branch)
          TRACK_COMMIT=$(field upstream_tracking_commit)
          MAX_DRIFT=$(field max_drift_commits)

          for v in UPSTREAM_URL UPSTREAM_BRANCH FORK_POINT TRACK_BRANCH TRACK_COMMIT MAX_DRIFT; do
            if [ -z "${!v}" ]; then
              echo "::error file=UPSTREAM.lock::$v is missing from UPSTREAM.lock"
              exit 1
            fi
          done

          echo "upstream        : $UPSTREAM_URL"
          echo "branch          : $UPSTREAM_BRANCH"
          echo "fork point      : $FORK_POINT"
          echo "tracking branch : $TRACK_BRANCH"
          echo "tracking commit : $TRACK_COMMIT"
          echo "max drift       : $MAX_DRIFT"

          git remote add upstream "$UPSTREAM_URL" 2>/dev/null ||             git remote set-url upstream "$UPSTREAM_URL"
          git fetch --quiet upstream "+refs/heads/$UPSTREAM_BRANCH:refs/remotes/upstream/$UPSTREAM_BRANCH"
          git fetch --quiet "$TRACKING_REMOTE" "+refs/heads/$TRACK_BRANCH:refs/remotes/origin/$TRACK_BRANCH" || {
            echo "::error file=UPSTREAM.lock::branch '$TRACK_BRANCH' does not exist on $TRACKING_REMOTE"
            exit 1
          }

          TIP=$(git rev-parse "refs/remotes/upstream/$UPSTREAM_BRANCH")
          HEAD_OF_TRACKING=$(git rev-parse "refs/remotes/origin/$TRACK_BRANCH")
          echo "live tip        : $TIP"
          echo "$TRACK_BRANCH is: $HEAD_OF_TRACKING"

          status=0

          # 1. The branch and the record agree.
          if [ "$HEAD_OF_TRACKING" != "$TRACK_COMMIT" ]; then
            echo "::error file=UPSTREAM.lock::$TRACK_BRANCH is at $HEAD_OF_TRACKING but UPSTREAM.lock records $TRACK_COMMIT. Move the branch and the record together."
            status=1
          fi

          # Checks 2-4 are about the REF, so they are measured against the branch
          # head and not against the string in the file. Measuring the recorded
          # value instead makes them unreachable in the case that matters: somebody
          # moves upstream-tracking to a dead branch and does not touch
          # UPSTREAM.lock, check 1 fires, and 2-4 sit there checking a commit that
          # is still correct. Verified by watching exactly that happen.

          # 2. The tracked ref is on the branch we claim to track. This is the
          #    assertion the task asked for, and on its own it is weaker than it
          #    looks -- see 3.
          if ! git merge-base --is-ancestor "$HEAD_OF_TRACKING" "$TIP"; then
            echo "::error file=UPSTREAM.lock::$TRACK_BRANCH ($HEAD_OF_TRACKING) is NOT an ancestor of $UPSTREAM_BRANCH ($TIP). It is not on the branch this fork tracks."
            status=1
          fi

          # 3. ...and it is newer than our own fork point. Every dead upstream
          #    branch (main, dev, 1181dev, challenges, shop, 1181-rogue-fixes) is
          #    an ancestor of the live branch and would sail through check 2; what
          #    gives them away is that they are all older than 61a8269.
          if ! git merge-base --is-ancestor "$FORK_POINT" "$HEAD_OF_TRACKING"; then
            echo "::error file=UPSTREAM.lock::$TRACK_BRANCH ($HEAD_OF_TRACKING) is behind this fork's own fork point $FORK_POINT -- that is the signature of one of upstream's dead branches, not of the branch we track."
            status=1
          fi

          # 4. Staleness, as distinct from wrongness.
          if git merge-base --is-ancestor "$HEAD_OF_TRACKING" "$TIP"; then
            DRIFT=$(git rev-list --count "$HEAD_OF_TRACKING..$TIP")
            echo "drift           : $DRIFT commits behind $UPSTREAM_BRANCH"
            if [ "$DRIFT" -gt "$MAX_DRIFT" ]; then
              echo "::error file=UPSTREAM.lock::tracked commit is $DRIFT commits behind $UPSTREAM_BRANCH (limit $MAX_DRIFT). Fetch upstream, move $TRACK_BRANCH, update UPSTREAM.lock."
              status=1
            elif [ "$DRIFT" -gt 0 ]; then
              echo "::notice::tracked commit is $DRIFT commits behind $UPSTREAM_BRANCH (limit $MAX_DRIFT)."
            fi
          fi

          [ "$status" -eq 0 ] && echo "UPSTREAM.lock agrees with $UPSTREAM_URL $UPSTREAM_BRANCH"
          exit $status

  build:
    name: Build core (Debian trixie)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so cmake/revision.h.cmake resolves a real hash instead
          # of the "unknown 1970-01-01 (Archived)" fallback. That fallback is a
          # deliberate feature for source archives with no .git, but a CI build
          # reporting 1970 as its revision cannot be matched to the commit that
          # produced it.
          fetch-depth: 0

          # src/modules/Eluna is a submodule (ElunaLuaEngine/Eluna) and the
          # root CMakeLists FATAL_ERRORs when LuaEngine.h is absent, because
          # BUILD_ELUNA defaults ON. A checkout without this configures for
          # about a second and then stops with "Eluna submodule is missing".
          submodules: recursive

      # Space this build genuinely needs: mangosd links to 750 MB with
      # DEBUG_SYMBOLS=ON, on top of a ~20 GB object tree, and /build lives on the
      # container filesystem which is the same / as the runner's.
      #
      # How much headroom there actually is varies by runner, and the honest
      # answer is that on the runner this job first ran on there was plenty --
      # 145 GB total, 104 GB free after the reclaim. That is why the df is
      # printed before AND after rather than just after: the numbers in a comment
      # go stale, the ones in the log are from the machine that ran the build. If
      # a future run shows the reclaim freeing nothing on a runner with room to
      # spare, this step can go.
      #
      # It stays for now because it costs seconds, the four directories are
      # preinstalled toolchains no C++ build here touches, and the failure it
      # guards against -- "no space left on device" forty minutes into a link --
      # reads like a compiler failure and is not one.
      - name: Reclaim runner disk
        run: |
          echo "before:"; df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          echo "after:";  df -h /

      # CCACHE_SLOPPINESS in the docker run below is what makes this cache worth
      # having at all, and it is not obvious enough to leave unexplained.
      #
      # USE_PCH defaults ON, and src/game and src/scripts -- which are most of
      # the build -- use target_precompile_headers(). ccache refuses to cache any
      # compilation that consumes a precompiled header unless it is told to be
      # sloppy about it. Measured on this tree, without the setting:
      #
      #   Cacheable calls:   128 / 687 (18.63%)
      #   Uncacheable calls: 559 / 687 (81.37%)
      #     Could not use precompiled header: 559 / 561 (99.64%)
      #
      # and with it, 276 / 276 (100%). That is not a tuning improvement; it is
      # the difference between caching a fifth of the build and caching all of
      # it. A ccache that quietly declines four fifths of the work is the same
      # category of failure as the cancel-in-progress bug -- every step reports
      # success and nothing is being cached.
      #
      # Both sloppiness flags were checked here rather than assumed safe.
      # time_macros makes ccache ignore __DATE__ and __TIME__, and neither macro
      # appears anywhere in this tree: the build's version string comes from
      # revision.h, which CMake generates and ccache then hashes as an ordinary
      # source file, so no stale timestamp can be baked into a cached object.
      # pch_defines means ccache will not notice a macro changing inside the
      # precompiled header itself, and that exposure is bounded by CI building a
      # fresh checkout every run with a cache that rotates per run.
      #
      # Deliberately NOT keyed on a hashFiles() of this workflow, which is the
      # obvious thing to reach for and is wrong here twice over. ccache already
      # hashes the compiler binary, the preprocessed source and the full command
      # line into every entry, so a changed package list or build type produces
      # different hashes and misses on its own -- a workflow-file key buys no
      # safety ccache does not already provide. What it does buy is a completely
      # cold build every time somebody edits a comment in this file, which is how
      # a cache ends up quietly never helping.
      #
      # The key is therefore write-once per run, and the restore-keys prefixes do
      # the actual work: a new branch falls back to the same branch's last cache,
      # then to any cache on this runner OS. That fallback is the difference
      # between a five-minute incremental and a cold build on every branch's
      # first push.
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-trixie-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ccache-trixie-${{ github.ref_name }}-
            ccache-trixie-

      # The compiler is Debian trixie's, not the runner's.
      #
      # This is the toolchain the project actually builds with, so pinning it
      # makes a green tick mean something: the GCC, ACE and Boost versions are
      # the ones a maintainer reproduces locally from the same image, rather than
      # whatever ubuntu-latest happens to ship this month.
      #
      # Driven with `docker run` rather than the job-level `container:` key,
      # because a container job's steps cannot see the runner's own filesystem
      # and the disk-reclaim step above has to run on the host to be worth
      # anything. Bind-mounting the workspace and the ccache directory gets the
      # same hermetic toolchain without giving that up.
      #
      # ca-certificates in the package list is not padding. It is absent from
      # debian:trixie's base image, and without it every https call made from
      # inside the container -- git over https, CMake's FetchContent, curl --
      # fails with a certificate verification error that names TLS and never
      # names the missing package. That misdiagnosis cost two separate debugging
      # sessions in twow-repo. It stays in this list whether or not today's build
      # appears to need it.
      - name: Configure and build
        run: |
          mkdir -p "${{ github.workspace }}/.ccache"
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            -v "${{ github.workspace }}/.ccache:/ccache" \
            -e CCACHE_DIR=/ccache \
            -e CCACHE_MAXSIZE=2G \
            -e CCACHE_SLOPPINESS=pch_defines,time_macros \
            -e DEBIAN_FRONTEND=noninteractive \
            -w /src \
            debian:trixie \
            bash -eo pipefail -c '
              apt-get update
              apt-get install -y --no-install-recommends \
                build-essential cmake ninja-build git ccache python3 ca-certificates \
                libace-dev default-libmysqlclient-dev libssl-dev zlib1g-dev libbz2-dev \
                libboost-dev libboost-thread-dev libboost-filesystem-dev \
                libboost-system-dev libboost-stacktrace-dev

              # The checkout is bind-mounted from the host, so its owning uid does
              # not match root inside the container and git refuses to read it.
              # CMake shells out to `git rev-parse` for the revision header, and a
              # refusal there produces the 1970 fallback silently rather than an
              # error, so this has to be set before configure runs.
              git config --global --add safe.directory /src

              ccache --zero-stats

              # No -D here names a module, a module directory, or the module
              # framework: this command line IS the acceptance test. The core has
              # to configure knowing nothing about the platform that will later
              # attach to it, and the "Host extensions: none (standalone core)"
              # line asserted in the next step is the core saying so itself.
              cmake -S /src -B /build -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_C_COMPILER_LAUNCHER=ccache \
                -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
                2>&1 | tee /src/configure.log

              # The default target, not "--target mangosd realmd".
              #
              # Naming the two binaries is why this job ran zero tests for its
              # entire existence. dep/lualib registers eluna.lua-runtime with
              # add_test(), enable_testing() fires (CMakeLists.txt, under
              # BUILD_ELUNA_TESTS, which defaults ON), so the test EXISTS in the
              # build tree after configure -- but eluna_lua_smoke was never on
              # this command line, so its executable was never compiled and ctest
              # would have had nothing to launch. Worse, the same omission would
              # silently swallow every test target added in future: a two-target
              # build is a permanent opt-out from testing that no green run ever
              # mentions.
              #
              # "all" was chosen over naming eluna_lua_smoke alongside the two
              # binaries because the naming is what failed, and the cost of not
              # naming things was measured rather than assumed. Under the settings this job
              # configuration -- no -D beyond build type and ccache, so
              # USE_EXTRACTORS and USE_REALMMERGE are OFF and MODULES is
              # "disabled" -- the default target links exactly the libraries
              # mangosd and realmd already pull in (shared, framework, game,
              # scripts, modules, g3dlite, re2, libdeflate, Recast, Detour,
              # lualib) plus one extra executable: eluna_lua_smoke, a single C
              # file linked against a liblualib.a the Eluna build produced
              # anyway.
              #
              # Measured, in this same debian:trixie image with the same configure
              # line: after "--target mangosd realmd" has finished, ninja has
              # exactly TWO edges left to reach "all" -- compile lua_smoke.c,
              # link eluna_lua_smoke -- and they took 8 seconds wall clock. Not
              # an estimate; liblualib.a is already a mangosd dependency, so
              # nothing else is pulled in. The extractors and RealmMerge, the
              # only targets in this tree that could make "all" expensive, are
              # behind USE_EXTRACTORS and USE_REALMMERGE and both default OFF.
              # If that ever changes, go back to naming targets -- and name the
              # test targets too -- rather than paying for tools nobody runs here.
              cmake --build /build -j "$(nproc)"

              ccache --show-stats

              # Run the registered tests, and refuse to pass when there are none.
              #
              # The count gate is not belt-and-braces, it is the whole point.
              # ctest exits 0 on an empty test set, which is precisely the state
              # this job was in for its entire life: green, and having executed
              # nothing. Adding a bare `ctest` would have made that state
              # permanent and invisible -- a renamed test target, a
              # BUILD_ELUNA_TESTS that drifts OFF, an enable_testing() dropped in
              # an upstream merge, and the job goes on reporting success while
              # testing zero things. A green run that tested nothing is worse
              # than a red one, because it gets believed.
              #
              # The number is deliberately not pinned to the 1 test of today. Pinning it
              # turns every new test into a CI failure, which is how a repository
              # teaches people not to add tests. "At least one" is the floor that
              # only catches the regression it is aimed at.
              test_count=$(ctest --test-dir /build -N | sed -n "s/^Total Tests: //p")
              echo "ctest registered tests: ${test_count:-0}"
              if [ "${test_count:-0}" -lt 1 ]; then
                echo "::error::ctest found no tests. The build configured and linked, but nothing was executed, so this run proves only that the code compiles. Check that the test targets were built (this step builds the default target for that reason) and that enable_testing() still fires."
                exit 1
              fi
              ctest --test-dir /build --output-on-failure

              # /build is deliberately NOT on the bind mount: writing a multi-
              # gigabyte object tree through the mount is several times slower
              # than writing it to the container filesystem. That makes it
              # container-private, so the two binaries have to be copied out for
              # the upload step to see them.
              #
              # Stripped on the way out. DEBUG_SYMBOLS defaults to ON, which
              # makes mangosd 750 MB and realmd 12 MB; stripped they are 21 MB
              # and 0.8 MB. Both figures are measured from this exact build, not
              # estimated. Uploading 750 MB on every push to every branch is
              # minutes of artifact transfer and a private-repo storage bill, for
              # a binary nobody is going to attach a debugger to -- this job
              # exists to prove the core compiles and links, and a stripped
              # binary proves the link just as well. Anyone who wants the symbols
              # builds locally from the same image.
              mkdir -p /src/out
              cp /build/src/mangosd/mangosd /build/src/realmd/realmd /src/out/
              strip /src/out/mangosd /src/out/realmd
              ls -la /src/out/

              # Execute the binaries this job ships. Before this line, not one
              # instruction of either had ever been run in CI: "green" meant they
              # compiled and linked, and nothing else.
              #
              # A successful link is not evidence that a binary starts. A missing
              # runtime .so, a bad RPATH, a static initialiser that aborts, an
              # ABI mismatch between the libmysqlclient linked against and the
              # one loaded -- every one of those links cleanly and dies on exec,
              # and no other step in this job can tell the two apart.
              #
              # --version is the cheapest invocation that proves it, because it
              # needs no fixtures: ACE_Get_Opt maps the long option to case v,
              # which printfs _FULLVERSION and returns 0 before any config file
              # is read or any database is touched (src/mangosd/Main.cpp and
              # src/realmd/Main.cpp). It must be spelled --version and not -v:
              # the short options string is ":c:s:", so a bare -v falls through
              # to the default case and exits 1.
              #
              # Run against /src/out -- the stripped binaries that are actually
              # uploaded -- rather than the originals in /build, so what is
              # tested is what is published.
              /src/out/mangosd --version
              /src/out/realmd --version
            '

      # There was an "Assert the core does not know the platform exists" step
      # here. It required configure.log to say "Host extensions : none
      # (standalone core)", failed if a modules/ directory existed, and failed if
      # any CMake file mentioned modules/. It is gone, and the reason is worth
      # the paragraph.
      #
      # Two separate ideas were being defended by one word. A MERGEABLE core --
      # branched from the real fork point so that `git merge upstream` works at
      # all -- is the reason this repository exists, and nothing here touches it.
      # A PURE core -- modules/ physically deleted so the core cannot reach the
      # platform even by accident -- was an addition, and it made sense only for
      # as long as upstream had no module system of its own to collide with.
      #
      # Upstream built one anyway. Shyalya's 8415f1b moved playerbots to
      # modules/mod-playerbots, independently arriving at the layout this project
      # had already built; their tree now ships modules/, modules/CMakeLists.txt,
      # modules/mod-dungeon-clear and modules/templates, and their core owns the
      # script-hook seam. So purity stopped being a property we maintained and
      # became a property we had to re-win against upstream on every single
      # merge: it accounted for 8 of the 24 conflicts measured against
      # playerbots-integration-gh, and -- worse than the conflicts -- silently
      # dropped upstream's cmake/ConfigureModules.cmake and modules/CMakeLists.txt
      # on merges where they did NOT conflict, because a delete on our side plus
      # no change on theirs merges quietly to "still deleted" and takes the build
      # with it.
      #
      # 385 commits behind is not the position from which to insist on a
      # structural preference. Upstream's arrangement is the reference now.

      - uses: actions/upload-artifact@v4
        with:
          name: server-binaries
          path: out/
          retention-days: 7

  # --------------------------------------------------------------- MSVC
  #
  # The first job in this repository's history that puts a Microsoft compiler
  # anywhere near this tree.
  #
  # WHY IT EXISTS. The core carries fixes that exist solely for MSVC and that
  # nothing verified until now:
  #
  #   * src/game/SharedDefines.h - TW_PI. MSVC's <math.h> defines M_PI only if
  #     _USE_MATH_DEFINES was defined before the FIRST include of that header,
  #     and <cmath> is #pragma once, so a TU that reached it earlier through
  #     <algorithm> or G3D has already missed the window. The observed failure
  #     was four "'M_PI': undeclared identifier" in src/game/Commands/Commands.cpp.
  #   * src/game/WorldSession.{h,cpp} - QueuePacket(std::unique_ptr<WorldPacket>)
  #     is defined out of line because MSVC instantiates default_delete eagerly
  #     on a type the header only forward-declares. GCC defers far enough to get
  #     away with the inline version.
  #
  # Both are ordinary C++ that GCC accepts, so the Debian job above cannot fail
  # on either of them. Only a compile with cl.exe can, and there was none.
  #
  # A third fix was expected here and is NOT in this repository: the
  # strtok_r -> strtok_s shim from twow-repo PR #8. "grep -rn strtok_r src/"
  # returns nothing in twow-core - neither the call nor the shim. That fix lives
  # in twow-repo's modules/, which is what msvc-portability.yml's static checker
  # covers, and it is out of this job's reach by construction.
  #
  # WHY IT LIVES HERE AND NOT IN twow-repo. twow-repo is private, so hosted
  # runners are metered there and its windows-compile job has never once
  # executed. twow-core is public: GitHub-hosted runners, Windows included, are
  # free. The gated job in twow-repo's ci.yml was read before this was written
  # and its vcpkg cache-key reasoning is reused below; the rest of it is not,
  # for the reasons each step gives.
  #
  # A CORRECTION THIS JOB IS EVIDENCE FOR. twow-repo's ci.yml carries the claim
  # "A clean clone CANNOT link on Windows - dep/windows/lib and mangosd.ico are
  # pinned external inputs kept out of Git (ADR-0019)". In this repository that
  # is false and has been for some time: "git ls-files dep/windows/lib" lists 36
  # tracked files (the MySQL and OpenSSL import libraries and their DLLs, win32
  # and x64, debug and release) and src/mangosd/mangosd.ico is tracked at 16958
  # bytes. The "Prove the clean checkout is self-sufficient" step below asserts
  # exactly that against the checkout this job is given, so the claim is now
  # checked on every run rather than repeated.
  windows-msvc:
    name: Build core (MSVC, windows-latest)
    runs-on: windows-latest
    timeout-minutes: 120

    env:
      # Written once, used twice - to install and to key the cache. Spelling the
      # package list out in two places is how a cache outlives the dependency set
      # it was built for and starts handing back the wrong ACE.
      #
      # ACE is the ONLY thing vcpkg is asked for. That is a measured claim, not
      # an assumption:
      #   MySQL, OpenSSL  - the root CMakeLists points WIN32 builds at
      #                     dep/windows/{include,lib}, which are in Git.
      #   zlib, bz2       - built from source out of dep/src/.
      #   Boost           - "grep -rn boost/ src/" finds zero includes in the
      #                     standalone core. Boost arrives only through
      #                     twow-repo's mod-playerbots, which is not here. The
      #                     twow-repo reference job installs four boost-* ports
      #                     this build has no use for.
      # ACE has no vendored copy and no other source, so it is the one port.
      VCPKG_TRIPLET: x64-windows
      VCPKG_PACKAGES: ace
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.vcpkg-cache

    steps:
      # Must precede checkout: core.longpaths is read when the working tree is
      # written. This is Git's own 260-character MAX_PATH limit, not the
      # filesystem's, and one new deep path would otherwise break every Windows
      # run with an error that names a filename and not the cause.
      - name: Allow long paths
        run: git config --system core.longpaths true

      # fetch-depth 0 for the same reason as the Debian job - cmake/revision.h.cmake
      # shells out to git and falls back to "unknown 1970-01-01 (Archived)"
      # silently when it cannot resolve a hash.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

          # Same reason the Debian job needs it: src/modules/Eluna is a
          # submodule and the root CMakeLists FATAL_ERRORs at line 81 when
          # LuaEngine.h is absent, because BUILD_ELUNA defaults ON. Leaving it
          # out cost run 33652876715 - which had already spent 5.5 minutes
          # building ACE - a three-second configure and the message "Eluna
          # submodule is missing".
          submodules: recursive

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Ninja ships in the Visual Studio installation on the hosted images, but
      # whether it is on PATH has changed between image releases. Checking and
      # falling back costs seconds; discovering it is missing inside "cmake -G
      # Ninja" costs a confusing error about a generator.
      - name: Ensure Ninja
        shell: pwsh
        run: |
          if (Get-Command ninja -ErrorAction SilentlyContinue) {
            Write-Host "ninja: $(ninja --version)"
          } else {
            Write-Host "ninja not on PATH - installing"
            choco install ninja --no-progress -y
          }

      # ADR-0019's premise, checked rather than recited. See the block above the
      # job for why: twow-repo's ci.yml still asserts the opposite in a comment,
      # and that comment has been steering decisions.
      - name: Prove the clean checkout is self-sufficient
        shell: pwsh
        run: |
          $missing = @()
          $required = @(
            'dep/windows/lib/x64_release/libmySQL.lib',
            'dep/windows/lib/x64_release/libssl.lib',
            'dep/windows/lib/x64_release/libcrypto.lib',
            'dep/windows/include/mysql/mysql.h',
            'dep/windows/include/openssl/ssl.h',
            'dep/windows/include/zlib/zlib.h',
            'src/mangosd/mangosd.ico'
          )
          foreach ($p in $required) {
            if (Test-Path $p) {
              Write-Host ("present: {0} ({1} bytes)" -f $p, (Get-Item $p).Length)
            } else {
              $missing += $p
              Write-Host "::error file=$p::required Windows input is not in this checkout"
            }
          }
          if ($missing.Count -gt 0) {
            Write-Error "$($missing.Count) tracked Windows input(s) missing - a clean clone cannot build Windows"
            exit 1
          }

      # The compiler has to be in the cache key. A vcpkg binary package built by
      # a different MSVC toolset is not a cache miss, it is a wrong answer.
      # VCToolsVersion is that toolset's build number and msvc-dev-cmd exports
      # it; asking cl.exe for its banner instead would mean capturing a native
      # command's stderr, which PowerShell 5.1 turns into an error record.
      - name: Record what the cache is keyed on
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .ci, $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          $toolset = if ($env:VCToolsVersion) { $env:VCToolsVersion } else { 'unknown-toolset' }
          $sdk     = if ($env:WindowsSDKVersion) { $env:WindowsSDKVersion } else { 'unknown-sdk' }
          $vcpkgVersion = (vcpkg version) -join ' '
          @(
            "toolset=$toolset"
            "sdk=$sdk"
            "vcpkg=$vcpkgVersion"
            "triplet=$env:VCPKG_TRIPLET"
            "packages=$env:VCPKG_PACKAGES"
          ) | Set-Content -Encoding utf8 .ci/msvc-cache-key.txt
          Get-Content .ci/msvc-cache-key.txt

      # No restore-keys and no run-id suffix. A vcpkg binary package is either
      # the one this exact toolset and package list asked for or it is useless,
      # so an inexact hit would only mean rebuilding ACE with extra steps. On an
      # exact hit actions/cache skips the save, which is why this entry does not
      # grow on every push.
      #
      # A MISS IS STILL A CORRECT BUILD, not a skipped one: vcpkg builds ACE
      # from source when the binary cache has nothing, which is the ~19 minutes
      # measured locally. Nothing below is conditional on the cache having hit.
      #
      # restore/save as two steps rather than one actions/cache, because
      # actions/cache's combined form saves in a post step that DOES NOT RUN
      # when the job fails. That is precisely backwards for this job: ACE is the
      # 5.5-minute part, it succeeds long before anything interesting can go
      # wrong, and the runs where the compile fails are exactly the runs that
      # will be repeated. Run 33652876715 built ACE, failed in `Configure`
      # seconds later, and threw the ACE away. The save below is if: always()
      # and sits directly after the install, so what was paid for is kept
      # whatever the rest of the job does.
      - name: Restore the vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: .vcpkg-cache
          key: msvc-vcpkg-${{ hashFiles('.ci/msvc-cache-key.txt') }}

      # vcpkg's binary caching is on by default and writes to
      # VCPKG_DEFAULT_BINARY_CACHE, so the env var above is the whole
      # configuration. The package list comes from the same variable the cache
      # key was built from, so the two cannot disagree.
      # Two things here were learned the hard way, both from run 33652440649.
      #
      # @($...) around the port list, not a bare pipeline. `... | ForEach-Object`
      # over a ONE-element list returns a scalar String, and splatting a String
      # into a native command with @ passes it one CHARACTER at a time. vcpkg
      # duly received `a`, `c`, `e`, `:`, `x` ... and reported
      # "error: expected a port name here" with the caret under a colon - a
      # message that describes the fourth character of the argument and names
      # nothing that would lead you back to the splat. @() forces an array, and
      # the failure cannot come back if VCPKG_PACKAGES grows a second port
      # either, which is what would have hidden it.
      #
      # --vcpkg-root, because two vcpkgs are installed on this image and they
      # disagree. ilammy/msvc-dev-cmd exports VCPKG_ROOT pointing at Visual
      # Studio's private copy (VC\vcpkg), while the vcpkg on PATH is the
      # standalone C:\vcpkg. vcpkg noticed and said so - "using detected vcpkg
      # root C:\vcpkg and ignoring mismatched VCPKG_ROOT" - and carried on, but
      # a warning that the tool is ignoring the environment is not something to
      # build a cached dependency on top of. The root is taken from the exe that
      # is actually going to run and then passed to it explicitly, and the same
      # value is what the next step derives the installed prefix from, so the
      # ACE that gets installed and the ACE that gets found cannot be different
      # ACEs.
      - name: Install ACE
        shell: pwsh
        run: |
          $vcpkgExe  = (Get-Command vcpkg).Source
          $vcpkgRoot = Split-Path -Parent $vcpkgExe
          Write-Host "vcpkg: $vcpkgExe (root $vcpkgRoot)"
          "TW_VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $pkgs = @(
            $env:VCPKG_PACKAGES -split '\s+' |
              Where-Object { $_ } |
              ForEach-Object { "${_}:$env:VCPKG_TRIPLET" }
          )
          Write-Host "installing $($pkgs.Count) port(s): $($pkgs -join ', ')"
          & $vcpkgExe install --vcpkg-root $vcpkgRoot @pkgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Skipped on an exact hit - there is nothing new to write, and actions/cache
      # would reject the duplicate key anyway.
      - name: Save the vcpkg binary cache
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .vcpkg-cache
          key: msvc-vcpkg-${{ hashFiles('.ci/msvc-cache-key.txt') }}

      # The OpenSSL trap, resolved rather than risked.
      #
      # The root CMakeLists puts ACE_INCLUDE_DIR ahead of OPENSSL_INCLUDE_DIR on
      # src/game's and src/shared's include path. vcpkg installs every port into
      # ONE shared include root, so if anything in that root ships OpenSSL
      # headers they shadow the bundled 1.1.1 headers in dep/windows/include -
      # and the build then compiles against 3.x while linking 1.1.1. The symptom
      # is exactly two unresolved symbols, OSSL_PROVIDER_load and
      # SSL_get1_peer_certificate, both of them version-guarded in the source and
      # therefore only referenced when the headers claim 3.x. That is a link
      # error that names OpenSSL nowhere.
      #
      # So: look, decide, and say which was chosen. If vcpkg brought OpenSSL in
      # (today ACE's default features do not, but that is a port's decision and
      # not ours), point the build at that copy so headers and import libraries
      # are the same version - which is the remedy the root CMakeLists documents.
      # Otherwise keep the bundled copy. Neither branch can silently mismatch.
      - name: Choose an OpenSSL
        shell: pwsh
        run: |
          $inst = Join-Path $env:TW_VCPKG_ROOT "installed/$env:VCPKG_TRIPLET"
          Write-Host "vcpkg installed prefix: $inst"
          "ACE_ROOT=$inst" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          if (Test-Path (Join-Path $inst 'include/openssl/opensslv.h')) {
            Write-Host "vcpkg's include root carries OpenSSL headers - using vcpkg's OpenSSL for headers AND libraries."
            "TW_OPENSSL_INCLUDE_DIR=$inst/include" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "TW_OPENSSL_LIBRARIES=$inst/lib/libssl.lib;$inst/lib/libcrypto.lib" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } else {
            Write-Host "vcpkg's include root has no OpenSSL - keeping the bundled 1.1.1 in dep/windows."
            "TW_OPENSSL_INCLUDE_DIR=" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "TW_OPENSSL_LIBRARIES=" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }
          Get-ChildItem (Join-Path $inst 'lib') -Filter '*.lib' -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name

      # ACE_ROOT rather than the vcpkg toolchain file. cmake/FindACE.cmake's
      # WIN32 branch searches ${ACE_ROOT} and $ENV{ACE_ROOT} explicitly, so this
      # is the search path the module was written for; the toolchain file would
      # work too, by way of CMAKE_PREFIX_PATH, but it also drops vcpkg's shared
      # prefix in front of every other find_package in the tree for no benefit
      # here - ACE is the only port installed.
      #
      # NO sccache, deliberately, and this is the one place this job diverges
      # from twow-repo's reference version. That job disables two things to make
      # sccache work - USE_PCH (sccache refuses any TU compiled with /Yu) and
      # MSVC_SEPARATE_PDB (it refuses /Zi too) - and its own comment concedes a
      # COLD build is then slower than no cache at all. Neither lever is
      # available here on the same terms:
      #   * MSVC_SEPARATE_PDB does not exist in twow-core. The root CMakeLists
      #     appends /Zi to CMAKE_CXX_FLAGS_RELEASE unconditionally for MSVC,
      #     with no option guarding it, so there is no way to switch it off from
      #     a command line and sccache would decline every single translation
      #     unit while the job reported success - the exact failure shape this
      #     repository has twice been bitten by.
      #   * This job LINKS. Building objects that no shipped configuration would
      #     ever produce, in order to make a cache work, weakens the only
      #     assertion the job makes.
      # The expensive dependency is ACE and that IS cached, above.
      #
      # AND A MEASUREMENT TO TAKE, not a claim: this build gets NO precompiled
      # headers, despite USE_PCH defaulting ON. USE_PCH_OLD also defaults ON
      # under MSVC, which routes src/game and src/scripts through
      # cmake/FindPCHSupport.cmake's ADD_NATIVE_PRECOMPILED_HEADER - and that
      # macro only does anything when CMAKE_GENERATOR matches "Visual Studio*"
      # or Xcode. With Ninja it falls through to a branch whose entire body is a
      # commented-out line, so it silently does nothing. If the compile time this
      # job reports is the problem, -DUSE_PCH_OLD=OFF is the first lever: it
      # switches both directories onto target_precompile_headers(), which is the
      # path the Debian job already builds through every day. It is deliberately
      # NOT set on the first run - the point of that run is to find out whether
      # this tree compiles and links with cl.exe at all, and adding an untested
      # variable to the same experiment is how a result stops meaning anything.
      - name: Configure
        shell: pwsh
        run: |
          $cmakeArgs = @(
            '-S', '.', '-B', 'build', '-G', 'Ninja',
            '-DCMAKE_BUILD_TYPE=Release',
            "-DACE_ROOT=$env:ACE_ROOT"
          )
          if ($env:TW_OPENSSL_INCLUDE_DIR) {
            $cmakeArgs += "-DOPENSSL_INCLUDE_DIR=$env:TW_OPENSSL_INCLUDE_DIR"
            $cmakeArgs += "-DOPENSSL_LIBRARIES=$env:TW_OPENSSL_LIBRARIES"
          }
          Write-Host "cmake $($cmakeArgs -join ' ')"
          cmake @cmakeArgs | Tee-Object -FilePath configure-msvc.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # NOT the "Host extensions : none (standalone core)" assertion the Debian
      # job used to make. That step was written here by copying it, and run
      # 33653835107 failed on it after a completely successful configure - the
      # line no longer exists. It was deliberately deleted from this file along
      # with the purity policy it enforced, for the reasons the long comment in
      # the Debian job still gives: upstream built a module system of its own,
      # and re-winning "modules/ does not exist" on every merge was silently
      # dropping upstream's ConfigureModules.cmake. Reinstating the assertion on
      # the Windows side would have quietly reinstated the policy.
      #
      # What is asserted instead is the thing that is still true and still worth
      # checking: this configure attached nothing. MODULES defaults to
      # "disabled", and if a future change made the core pull a module in by
      # default, the Windows build would be the first place it showed up as a
      # link error with no explanation.
      - name: Assert the core configured with nothing attached
        shell: pwsh
        run: |
          if (-not (Select-String -Path configure-msvc.log -SimpleMatch 'Build modules         : disabled' -Quiet)) {
            Write-Host "::error::configure did not report 'Build modules: disabled' - the core did not configure standalone"
            Write-Host "--- configure-msvc.log ---"
            Get-Content configure-msvc.log | Select-String -SimpleMatch '-- ' | ForEach-Object { $_.Line }
            exit 1
          }
          Write-Host "core configured standalone (no modules attached)"

      # mangosd and realmd - the same two targets the Debian job builds, so a
      # green tick here means the same thing it means there.
      #
      # WHAT THIS STEP HAS ALREADY ESTABLISHED (run 33655093266, the first full
      # MSVC pass over this tree in the repository's history):
      #
      #   * realmd.exe LINKS on Windows. "[766/775] Linking CXX executable
      #     bin/realmd.exe", no error LNK anywhere in the log. That was an open
      #     question - the only previous local Windows build stopped after the
      #     extractors and never attempted either daemon.
      #   * mangosd.exe does not, and the reason is not mangosd: 735 of 775
      #     objects built, and every failure is one of 27 translation units in
      #     the `game` library.
      #   * All 27 are missing-declaration errors, and they share one cause. On
      #     Linux, target_precompile_headers() force-includes ObjectMgr.h,
      #     Common.h and SharedDefines.h into EVERY game translation unit, so
      #     headers that depend on a name they never declare are never compiled
      #     in isolation. Three examples, each cascading into dozens of
      #     downstream errors in the same TU:
      #       GameObject.h(835)  Group* GetGroupLootRecipient() - GameObject.h
      #                          never declares Group; ObjectMgr.h does.
      #       SpellAuras.h(223)  AuraRemoveMode - declared in
      #                          Objects/UnitDefines.h, reached via ObjectMgr.h.
      #       Eluna Hooks.h(17)  uint8 - declared in shared/Common.h.
      #     The right fix is the forward declarations and includes those headers
      #     are missing. It is NOT to give this job the same precompiled header,
      #     which would restore the mask rather than remove it - see the note on
      #     USE_PCH_OLD above, and take that decision deliberately if the cost of
      #     this job is judged too high to carry while the 27 are fixed.
      #
      # If this step fails, the failure IS the finding and the job stays red
      # until it is fixed. It is not continue-on-error and must not become one.
      #
      # This step deliberately still names the two binaries, where the Debian job
      # now builds the default target so that ctest has something to run. The
      # asymmetry is a decision, not an oversight:
      #
      #   * This job's subject is cl.exe's opinion of this tree. The one test
      #     that exists, eluna.lua-runtime, exercises the Lua interpreter's C
      #     runtime, which is not a question about MSVC portability and is
      #     already answered once per push by the Debian job.
      #   * -k 0 means a red build here continues to the end and exits non-zero
      #     anyway, so a ctest step appended after it would never run on the runs
      #     where it might have said something new.
      #   * It could not be verified before merging. There is no MSVC toolchain
      #     outside this runner, and each attempt costs a 30-minute job. Adding
      #     an unverified gate to the job with this repository's most fragile
      #     history buys a plausible failure mode and no coverage.
      #
      # Revisit when a test lands that is about Windows. Until then the honest
      # statement is that Windows compiles and links, and Linux compiles, links,
      # tests and runs.
      - name: Build mangosd and realmd
        id: build
        shell: pwsh
        run: |
          Write-Host "free space before:"
          Get-PSDrive -PSProvider FileSystem | Where-Object { $null -ne $_.Used } |
            Format-Table Name, @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}} | Out-String | Write-Host
          # -k 0 - keep going after a failure instead of stopping at the first.
          #
          # Ninja's default is to stop, which is right for a developer's inner
          # loop and wrong for a job like this one: every red run then reports
          # exactly ONE broken translation unit, and finding out whether there
          # are two more or two hundred costs a full push-and-wait per error.
          # Run 33654643574 stopped on the first one. With -k 0 a single run is
          # an inventory: every TU cl.exe rejects appears in the same log, and
          # the coverage step below can still say which of the two MSVC-only
          # fixes were reached. The job is no less red - ninja still exits
          # non-zero and the link still does not happen.
          cmake --build build --target mangosd realmd --parallel -- -k 0
          $rc = $LASTEXITCODE
          Write-Host "free space after:"
          Get-PSDrive -PSProvider FileSystem | Where-Object { $null -ne $_.Used } |
            Format-Table Name, @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}} | Out-String | Write-Host
          if ($rc -ne 0) { exit $rc }

      # The point of the whole job, asserted rather than assumed.
      #
      # "The build was green" does not establish that the MSVC-only fixes were
      # compiled - a target rename, a source-list edit or a configure that
      # quietly dropped src/game would all leave a green job that proved nothing.
      # These are the two translation units that carry the fixes, named
      # individually. WorldSession.cpp holds the out-of-line QueuePacket, and
      # Commands.cpp is the file whose four "'M_PI': undeclared identifier"
      # errors caused TW_PI to exist; TW_PI itself is referenced only from
      # constexpr functions inside SharedDefines.h, which every TU that includes
      # that header parses and checks in full.
      # always(), so a FAILED build still reports which of the two translation
      # units it got to - that is the difference between "MSVC rejects
      # WorldSession.cpp" and "MSVC never reached it". Gated on the build step
      # having actually run, though: when the job dies earlier (a bad vcpkg
      # invocation, say) this step would otherwise add a second, louder error
      # about object files that were never going to exist, on top of the real
      # one. That happened on the first run and it buried the actual cause.
      - name: Confirm the MSVC-only fixes were actually compiled
        if: always() && steps.build.conclusion != 'skipped'
        shell: pwsh
        run: |
          $wanted = [ordered]@{
            'WorldSession.cpp.obj' = 'src/game/WorldSession.cpp - out-of-line QueuePacket(unique_ptr)'
            'Commands.cpp.obj'     = 'src/game/Commands/Commands.cpp - includes SharedDefines.h / TW_PI'
          }
          $objs = Get-ChildItem build -Recurse -Filter *.obj -ErrorAction SilentlyContinue
          Write-Host "$($objs.Count) object files in the build tree"
          $fail = $false
          foreach ($name in $wanted.Keys) {
            $hit = $objs | Where-Object { $_.Name -eq $name } | Select-Object -First 1
            if ($hit) {
              Write-Host ("compiled: {0} -> {1}" -f $wanted[$name], $hit.FullName)
            } else {
              Write-Host "::error::$name was never compiled - $($wanted[$name]) is NOT covered by this job"
              $fail = $true
            }
          }
          if ($fail) { exit 1 }

      - name: Confirm the executables linked
        shell: pwsh
        run: |
          $fail = $false
          $roots = @('build', 'bin') | Where-Object { Test-Path $_ }
          foreach ($exe in @('mangosd.exe', 'realmd.exe')) {
            $hit = Get-ChildItem $roots -Recurse -Filter $exe -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($hit) {
              Write-Host ("linked: {0} ({1:N1} MB) at {2}" -f $exe, ($hit.Length/1MB), $hit.FullName)
            } else {
              Write-Host "::error::$exe was not produced"
              $fail = $true
            }
          }
          if ($fail) { exit 1 }

      # Nothing is uploaded. A Windows binary out of this job has no consumer -
      # the deployment platform is Linux and Docker - and the .pdb files /Zi
      # produces are large. The link succeeding is the whole result; the bytes
      # are not wanted.
      #
      # TRIGGER, AND THE NUMBERS IT SHOULD BE DECIDED ON. This job runs wherever
      # the Debian job runs: pushes to main, every pull request, and
      # workflow_dispatch. Measured on run 33655093266:
      #
      #   whole job, warm vcpkg cache      32m 20s
      #     of which the compile itself    31m 20s
      #     of which ACE (cache hit)           17s
      #   ACE on a cache MISS (run 33653835107)   5m 45s, so cold is ~38m
      #   the Debian job on the same commit        ~3m 30s
      #
      # Roughly ten times the Linux job, and that 31 minutes is for a build that
      # gets no precompiled headers and does not reach the mangosd link - a
      # green one is longer, not shorter. Running that on every push and every
      # pull request is a real cost, and this file is not the place to decide
      # alone whether it is worth paying. The alternatives are pull_request only,
      # or the nightly slot; either is a one-line change. Left on the broad
      # trigger for now so the numbers keep coming in from real runs rather than
      # from a single measurement, and so a Windows break is caught next to the
      # commit that caused it while the 27 known failures are being worked on.
