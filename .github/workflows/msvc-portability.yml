# Faengt Windows-Build-Brueche ab, ohne dass jemand Windows braucht.
#
# Anlass: PR #8 musste strtok_r fuer MSVC nachruesten, und mod-dungeon-clear
# hatte dirent.h und localtime_r im Code. Beides faellt unter Linux nie auf,
# weil dort alles uebersetzt - und niemand baut vor dem Merge unter Windows.
#
# Bewusst nur die Module, nicht der Kern: dort meldet der Pruefer 60 Treffer,
# die grosse Mehrheit davon zu Recht bestehend (M_PI ist im Kern anders
# geloest, PosixDaemon.cpp wird unter Windows nie gebaut, httplib.h und
# json.hpp sind Fremdcode). Eine CI, die 60 Fehler meldet, wird abgeschaltet
# statt befolgt.
name: MSVC-Portabilität

on:
  pull_request:
    paths:
      - 'modules/**'
      - '.github/workflows/msvc-portability.yml'
  push:
    paths:
      - 'modules/**'
      - '.github/workflows/msvc-portability.yml'
  workflow_dispatch:

jobs:
  check:
    name: POSIX-only-Aufrufe in den Modulen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Nicht jeder Branch fuehrt jedes Modul. Fehlt der Pruefer, ist das
      # kein Fehlschlag - nur nichts zu tun.
      - name: Prüfer suchen
        id: suchen
        run: |
          gefunden=$(find modules -name check_msvc_portability.py -type f | head -20)
          if [ -z "$gefunden" ]; then
            echo "Kein Portabilitätsprüfer in modules/ - übersprungen."
            echo "vorhanden=nein" >> "$GITHUB_OUTPUT"
          else
            echo "$gefunden"
            echo "vorhanden=ja" >> "$GITHUB_OUTPUT"
            echo "pfade<<ENDE" >> "$GITHUB_OUTPUT"
            echo "$gefunden" >> "$GITHUB_OUTPUT"
            echo "ENDE" >> "$GITHUB_OUTPUT"
          fi

      - name: Prüfen
        if: steps.suchen.outputs.vorhanden == 'ja'
        run: |
          status=0
          while IFS= read -r pruefer; do
            [ -z "$pruefer" ] && continue
            echo "::group::$pruefer"
            python3 "$pruefer" || status=1
            echo "::endgroup::"
          done <<< "${{ steps.suchen.outputs.pfade }}"
          exit $status

      # Weitere Modul-Prüfer, nach demselben Muster gesucht: fehlt einer, ist
      # das kein Fehlschlag, sondern nichts zu tun.
      #
      # Diese Prüfer liegen seit jeher in den Modulen und liefen NIRGENDS. Der
      # einzige Aufrufer war die mitgelieferte upstream-Workflow-Datei des
      # Moduls, die dieses Repository nicht ausführt. Vorhanden, dokumentiert,
      # nie ausgeführt.
      #
      # gen_routes.py --check: eine aufgezeichnete Route existiert zur Laufzeit
      # nur, wenn RecordedRoutes.cpp ihre Register-Funktion aufruft. Das Modul
      # ist eine statische Bibliothek, also verwirft der Linker jede
      # Übersetzungseinheit, deren einzige Ausgabe eine Funktion ist, die
      # niemand aufruft - samt ihrer Route, ohne Warnung.
      #
      # check_config_reads.py: jeder DungeonClear-Schalter muss über DcSettings
      # gelesen werden. Ein roher sConfigMgr-Zugriff protokolliert bei JEDEM
      # Aufruf "Config: Missing property"; laut Kopfzeile des Moduls hat das
      # Server.log bereits zweimal geflutet.
      - name: Weitere Modul-Prüfer suchen
        id: weitere
        run: |
          gefunden=""
          for name in gen_routes.py check_config_reads.py; do
            treffer=$(find modules -name "$name" -type f | head -20)
            [ -n "$treffer" ] && gefunden="$gefunden$treffer"$'\n'
          done
          if [ -z "$(printf '%s' "$gefunden" | tr -d '[:space:]')" ]; then
            echo "Keine weiteren Modul-Prüfer gefunden - übersprungen."
            echo "vorhanden=nein" >> "$GITHUB_OUTPUT"
          else
            printf '%s' "$gefunden"
            echo "vorhanden=ja" >> "$GITHUB_OUTPUT"
            echo "pfade<<ENDE" >> "$GITHUB_OUTPUT"
            printf '%s' "$gefunden" >> "$GITHUB_OUTPUT"
            echo "ENDE" >> "$GITHUB_OUTPUT"
          fi

      - name: Weitere Modul-Prüfer ausführen
        if: steps.weitere.outputs.vorhanden == 'ja'
        run: |
          status=0
          while IFS= read -r pruefer; do
            [ -z "$pruefer" ] && continue
            # gen_routes.py schreibt ohne Argument die Datei neu; in der CI
            # darf es nur prüfen.
            case "$pruefer" in
              *gen_routes.py) args="--check" ;;
              *)              args="" ;;
            esac
            echo "::group::$pruefer $args"
            python3 "$pruefer" $args || status=1
            echo "::endgroup::"
          done <<< "${{ steps.weitere.outputs.pfade }}"
          exit $status
