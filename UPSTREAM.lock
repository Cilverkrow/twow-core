# Where this fork came from, and what it is based on.
#
# Machine-readable so CI can assert it and a human can read it. Update the
# fork_point only when this branch is genuinely rebased or merged onto a newer
# upstream commit -- it is the answer to "what does our delta apply to".

# The upstream of record, Shyalya/tortoise-wow (branch playerbots-integration-gh),
# announced its retirement (ADR-0026 amendment of 2026-09-27) and was removed from
# GitHub on 2026-10-01: the repository answers 404 and `git ls-remote` reports
# "Repository not found". Its history had been snapshotted into this repository
# beforehand as tag upstream-archive/shyalya-playerbots-integration-gh-2026-09-27
# (tip f2df1b6aff7ea589db4682836d7652ada77f9377, 945 commits). The checks below need
# a branch to fetch (tools/ci/check-upstream-lock.sh fetches refs/heads only), so
# the same commit is published as the branch named here. It is FROZEN: nobody pushes
# to it, and since nothing can arrive after f2df1b6a, max_drift_commits below now
# measures a fixed distance (49) rather than staleness.
#
# Former values: upstream_url = https://github.com/Shyalya/tortoise-wow.git
#                upstream_branch = playerbots-integration-gh
upstream_url    = https://github.com/Cilverkrow/twow-core.git
upstream_branch = upstream-archive-playerbots-integration-gh

# The commit this fork's delta is applied on top of: the merge base between our
# history and the branch we track. Re-derive it rather than trusting this line --
# it was wrong for the life of the fork:
#
#   git fetch upstream playerbots-integration-gh
#   git merge-base origin/main upstream/playerbots-integration-gh
#   -> 6be01e533342912604a671d37a0e3c87f5bbdf54
#
# It read 61a8269151721f6467eddb05e7bed37704d0fc0b until 2026-09-27, which is an
# ancestor of the real merge base by 512 commits:
#
#   git rev-list --count 61a8269..6be01e53   -> 512
#
# Wrong in the benign direction -- it understated how current we are -- and still
# wrong, because every "we are N commits behind upstream" figure derived from it
# is off by 512. CI now asserts this value directly: it must be an ancestor of
# HEAD, an ancestor of upstream/<upstream_branch>, and equal to the merge base of
# the two. See tools/ci/check-upstream-lock.sh, checks 5-7, which is runnable by
# hand. Nothing asserted it before; checks 1-4 used it only as a floor for the
# tracking branch, and a stale floor is still a floor, which is why 512 commits
# of drift sat here green.
fork_point      = 6be01e533342912604a671d37a0e3c87f5bbdf54

# ADR-0020 originally recorded db5fb2a as "the upstream tip". That is not an
# upstream hash: it is a commit in twow-repo, whose history was rewritten with
# git-filter-repo to strip binaries, so its hashes correspond to nothing
# upstream. The mapping to 61a8269 was confirmed by content -- every file under
# src/game is identical between the two, the only difference being the 146
# warden .cr/.key binaries filter-repo removed and this repository still has.
former_recorded_base = db5fb2a197f05611ad9d243568122c6be466ab8a  # twow-repo hash, not upstream

# Upstream tip when this fork was created. Historical only: it is the answer to
# "how big was the gap on day one", not to "what are we tracking now". Every
# "we are N behind" figure computed against this line is wrong by construction,
# and at least one has been.
upstream_tip_at_fork      = be3e6cdd47680c1308251e115164eb3d9eecc6f7

# ---------------------------------------------------------------------------
# What we track, and what CI asserts about it.
#
# The branch above is not decoration. Shyalya's `main`, `dev`, `1181dev`,
# `challenges`, `shop` and `1181-rogue-fixes` are all ANCESTORS OF OUR FORK
# POINT -- dead branches, every one of them behind the code we already have.
# Merging any of them is a no-op at best. That has been attempted once, from a
# prose instruction in ADR-0026 that named the right branch and was read as if
# it named any branch. Prose did not stop it, so this file is checked by CI
# instead: see the `upstream-freshness` job in .github/workflows/ci.yml. It runs
# on every pull request and weekly. Not on a push to upstream-tracking -- GitHub
# reads the workflow from the ref being pushed, and that ref is a verbatim mirror
# of upstream with no workflow in it.
#
# upstream_tracking_branch is the local mirror branch. upstream_tracking_commit
# is what it must point at. CI asserts, in this order:
#
#   1. origin/<upstream_tracking_branch> == upstream_tracking_commit
#        -- the branch was moved without updating this file, or vice versa.
#   2. origin/<upstream_tracking_branch> is an ancestor of
#      upstream/<upstream_branch>
#        -- the ref is not on the branch we claim to track at all.
#   3. fork_point is an ancestor of origin/<upstream_tracking_branch>
#        -- this is the dead-branch trap. Assertion 2 alone does NOT catch it:
#           every dead branch listed above IS an ancestor of the live branch,
#           so an ancestor test passes happily on all six of them. What
#           separates them is that they are all OLDER than our fork point,
#           and a commit we are genuinely tracking never is.
#   4. origin/<upstream_tracking_branch> is at most `max_drift_commits` behind
#      the live branch tip -- staleness, as opposed to wrongness.
#   5. fork_point is an ancestor of HEAD
#        -- our delta cannot apply on top of a commit we do not contain.
#   6. fork_point is an ancestor of upstream/<upstream_branch>
#        -- it is not a commit on the branch we claim to be based on.
#   7. fork_point EQUALS git merge-base HEAD upstream/<upstream_branch>
#        -- the strong form, and deliberately so. Ancestry alone is exactly the
#           hole 61a8269 sat in for the life of the fork. Equality does not go
#           red merely because upstream advanced: a merge base moves only when
#           OUR side absorbs upstream commits, so the daily case (upstream
#           pushes, we do nothing) stays green and that species of staleness is
#           check 4's job, with a budget. Check 7 goes red exactly when somebody
#           merges upstream and forgets this file.
#
# 2, 3 and 4 measure the BRANCH, not the string recorded on the
# upstream_tracking_commit line. Measuring the recorded value makes them
# unreachable in the case that matters: move the branch to a dead one and leave
# this file alone, and check 1 fires while 2-4 sit there approving a commit
# nothing points at. Seen happen, then fixed.
#
# 5, 6 and 7 are the opposite, and not a relapse into that mistake: fork_point
# has no branch anywhere to be measured instead of, so the recorded string IS
# the claim, and checking it against computed history is the only thing there is
# to do. That distinction is the whole reason a stale fork_point survived: the
# job was named after the ref, checked the ref, and never audited the one value
# in this file that nothing points at.
#
# Updating this pair is the whole ceremony for "we have looked at upstream":
# move the branch, put the same hash here, let CI agree.
upstream_tracking_branch  = upstream-tracking
upstream_tracking_commit  = 3f9a0622fd8f5fad1737b14a71a38497fc27ea09

# How far behind upstream/playerbots-integration-gh the tracked commit may fall
# before CI fails. Not zero: upstream pushes most days, and a check that goes
# red on every unrelated pull request the moment somebody else commits is a
# check that gets switched off. Not unbounded either -- be3e6cd sat here for
# the life of the fork and was 385 commits stale by the time anyone measured.
max_drift_commits         = 50

# ---------------------------------------------------------------------------
# Tracking mode (ADR-0026, owner decision 2026-10-01: variant (a)).
#
# "We are our own trunk from now on." Upstream tracking is retired: this file
# stays as the historical record of where the fork came from, pointed at the
# frozen archive branch above. check-upstream-lock.sh skips the drift check
# (check 4) in this mode -- nothing can arrive after the archive tip, so a budget
# against it would measure a constant -- and keeps the history checks 1-3 and
# 5-7, which still catch a moved tracking branch, a dead-branch merge and a
# forgotten fork_point. Upstream content (Penqle/tortoise-wow and related
# projects, reviewed monthly per ADR-0026) arrives only by deliberate
# cherry-pick, never by merging a branch. `live` would re-enable check 4 and is
# only meaningful with a live upstream_url.
upstream_tracking_mode    = retired
